# Draft Lab: refresh the data, test, build and deploy to GitHub Pages.
# - push to main: test, build, browser-test and deploy the pushed code.
# - schedule (Mondays 06:00 UTC) and "Run workflow": first sync the data and, when every check passes, commit it to
#   main (every check passes, including the browser tests); then test, build, browser-test and deploy. Any failure stops the run: nothing is committed or deployed,
#   and GitHub emails the repo owner about the failed run.
# One workflow does all of it because a push made with the workflow's own token does not start another run.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync:
        description: Refresh the data before deploying
        type: boolean
        default: true
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Check for changed data
        id: changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.changed == 'true'
        run: npm test
      - if: steps.changes.outputs.changed == 'true'
        run: npm run test:integration
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build
      - if: steps.changes.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changes.outputs.changed == 'true'
        run: npm run e2e:ci
      - name: Commit the new data
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(node -p "require('./data/gen9championsvgc2026regmb/meta.json').usage?.month ?? 'no usage'")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "data: weekly sync (usage ${month})" -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

  build:
    needs: sync
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  e2e:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:ci
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    needs: e2e
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:live
        env:
          DRAFTLAB_URL: ${{ needs.deploy.outputs.url }}
